name: Build & Release plug-in

# Builds the Maya plug-in (.mll) against the Maya 2027 DevKit and, on a version
# tag, publishes it as a GitHub Release asset.
#
#   * Push a tag like  v1.0.0  -> builds + creates a Release with the .mll attached.
#   * Manual "Run workflow" -> builds + uploads the .mll as a build artifact only
#     (no Release), so you can exercise the pipeline without cutting a release.
#
# The runner downloads the Maya DevKit from Autodesk's public CDN (URL below). To
# build against a different version, override the URL without editing this file by
# adding a repository secret:
#
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  MAYA_DEVKIT_URL
#     Value: <direct download URL for the target Maya Windows DevKit .zip>
#
# DevKit URLs come from the Maya Developer Center: https://aps.autodesk.com/developer/overview/maya-api

env:
  # Default: Maya 2027.1 Windows DevKit (public Autodesk CDN). Override via the
  # MAYA_DEVKIT_URL repository secret to target a different version.
  DEFAULT_MAYA_DEVKIT_URL: "https://autodesk-adn-transfer.s3.us-west-2.amazonaws.com/ADN+Extranet/M%26E/Maya/devkit+2027/Autodesk_Maya_2027_1_Update_DEVKIT_Windows.zip"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve DevKit URL
        shell: pwsh
        env:
          SECRET_URL: ${{ secrets.MAYA_DEVKIT_URL }}
        run: |
          # Prefer the repository secret if set; otherwise fall back to the default.
          $url = if ([string]::IsNullOrWhiteSpace($env:SECRET_URL)) { $env:DEFAULT_MAYA_DEVKIT_URL } else { $env:SECRET_URL }
          if ([string]::IsNullOrWhiteSpace($url)) {
            Write-Error "No DevKit URL available (neither MAYA_DEVKIT_URL secret nor DEFAULT_MAYA_DEVKIT_URL is set)."
            exit 1
          }
          $source = if ([string]::IsNullOrWhiteSpace($env:SECRET_URL)) { "default" } else { "MAYA_DEVKIT_URL secret" }
          Write-Host "Using DevKit URL from $source"
          "MAYA_DEVKIT_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download & unzip Maya DevKit
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "maya-devkit.zip"
          $dest = Join-Path $env:RUNNER_TEMP "maya-devkit"
          Write-Host "Downloading Maya DevKit..."
          Invoke-WebRequest -Uri $env:MAYA_DEVKIT_URL -OutFile $zip
          Write-Host "Extracting to $dest ..."
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          # The DevKit zip contains a 'devkitBase' folder holding include/ and lib/.
          # Find it whether it's at the root of the zip or one level down.
          $base = Get-ChildItem -Path $dest -Recurse -Directory -Filter "devkitBase" |
                  Select-Object -First 1
          if ($null -eq $base) {
            # Some zips lay include/ and lib/ directly at the top level.
            $hasInclude = Get-ChildItem -Path $dest -Recurse -Directory -Filter "include" |
                          Where-Object { Test-Path (Join-Path $_.Parent.FullName "lib") } |
                          Select-Object -First 1
            if ($null -eq $hasInclude) {
              Write-Error "Could not locate a 'devkitBase' (or include/+lib/) folder in the extracted DevKit."
              exit 1
            }
            $mayaLocation = $hasInclude.Parent.FullName
          } else {
            $mayaLocation = $base.FullName
          }

          Write-Host "MAYA_LOCATION = $mayaLocation"
          if (-not (Test-Path (Join-Path $mayaLocation "lib/OpenMaya.lib"))) {
            Write-Error "DevKit at $mayaLocation has no lib/OpenMaya.lib - is this the right (Windows) DevKit?"
            exit 1
          }
          "MAYA_LOCATION=$mayaLocation" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DMAYA_LOCATION="$env:MAYA_LOCATION"

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Locate built .mll
        id: mll
        shell: pwsh
        run: |
          $mll = Get-ChildItem -Path build -Recurse -Filter "ParametricStaircaseNode.mll" |
                 Select-Object -First 1
          if ($null -eq $mll) {
            Write-Error "Build succeeded but ParametricStaircaseNode.mll was not found under build/."
            exit 1
          }
          Write-Host "Built: $($mll.FullName)"
          "path=$($mll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParametricStaircaseNode-mll
          path: ${{ steps.mll.outputs.path }}
          if-no-files-found: error

      - name: Create Release & attach .mll
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.mll.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
